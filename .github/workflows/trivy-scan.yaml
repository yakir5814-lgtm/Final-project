name: trivy-scan

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    inputs:
      severity_level:
        description: 'Choose scan severity level'
        required: true
        default: 'HIGH,CRITICAL'
        type: choice
        options:
          - 'CRITICAL'
          - 'HIGH,CRITICAL'
          - 'LOW,MEDIUM,HIGH,CRITICAL'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.severity_level || 'HIGH,CRITICAL' }}
          cache: true

      - name: Build Application
        run: |
          echo "Trivy scan passed successfully!"
          echo "Starting the application build process..."
