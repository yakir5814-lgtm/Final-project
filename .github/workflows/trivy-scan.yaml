name: trivy-scan

on:
  push:
    branches: [ "main", "dev" ]
  workflow_dispatch:
    # 2. הוספת קלטים מותאמים אישית להרצה ידנית (custom action inputs)
    inputs:
      severity_level:
        description: 'Choose scan severity level'
        required: true
        default: 'HIGH,CRITICAL'
        type: choice
        options:
          - 'CRITICAL'
          - 'HIGH,CRITICAL'
          - 'LOW,MEDIUM,HIGH,CRITICAL'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. שימוש בבופר/מטמון מובנה של ה-Action (dependency cache)
      - name: Install Trivy CLI
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          cache: true

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          severity: '${{ github.event.inputs.severity_level || 'HIGH,CRITICAL' }}'
