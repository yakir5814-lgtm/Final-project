name: Secrets and Variables Lab Solution

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # מאפשר לך להריץ את ה-Workflow ידנית לבדיקה

jobs:
  # חלק 1: ריצה על סביבת production והדפסת המשתנה
  production-job:
    runs-on: ubuntu-latest
    environment: production # שולף את המשתנים של סביבת production

    steps:
      - name: Print MY_ENVIRONMENT for production
        run: echo "The environment is ${{ vars.MY_ENVIRONMENT }}"

  # חלק 2: שימוש בסוד והדפסתו
  development-job:
    runs-on: ubuntu-latest
    environment: development # שולף את המשתנים של סביבת development

    steps:
      - name: Print MY_ENVIRONMENT for development
        run: echo "The environment is ${{ vars.MY_ENVIRONMENT }}"

      - name: Use and Print Repository Secret
        env:
          SECRET_USER: ${{ secrets.JB_DEMO_USER }} # שליפת הסוד הגלובלי
        run: |
          echo "Using the repository secret..."
          echo "The secret user is: $SECRET_USER"
