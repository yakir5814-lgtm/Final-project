name: Slack Notification Lab

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Build
        run: echo "Running 'docker build' for the application..."

      - name: Docker Push
        run: echo "Running 'docker push' to repository..."

  helm-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Helm Template Validation
        run: echo "Running 'helm template' to validate manifests..."

  notify:
    runs-on: ubuntu-latest
    needs: [docker-build-push, helm-test]
    steps:
      - name: Send Slack Notification
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SLACK_CHANNEL: elevy99927-alerts
          SLACK_COLOR: '#36a64f'
          SLACK_MESSAGE: 'The Pipeline finished successfully! Docker build/push and Helm template steps passed. 🚀'
          SLACK_TITLE: 'Pipeline Success Alert'
